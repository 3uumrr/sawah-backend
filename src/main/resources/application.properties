spring.application.name=Sawah Application

# Server Configuration
server.port=9091

# MySQL Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA and Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

api.prefix=/api/v1

# Admin Prop
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}


#  Redis? Cache Provider
spring.cache.type=redis

# ?????? ??? Cloud
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=TRACE
spring.data.redis.ssl.enabled=false
spring.cache.redis.time-to-live=10m


auth.token.jwt-secret-key=${JWT_SECRET_KEY}
auth.token.expiration-in-mils=${JWT_EXPIRATION_TIME}

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8



spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Settings
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

validate.email.api-key=${VALIDATE_EMAIL_API_KEY}

google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.mobile-client-id=${GOOGLE_MOBILE_CLIENT_ID}

# Gemini Settings
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# \u062A\u062D\u062F\u064A\u062F \u0627\u0644\u0645\u0648\u062F\u064A\u0644 (Flash \u0647\u0648 \u0627\u0644\u0623\u0633\u0631\u0639 \u0648\u0627\u0644\u0623\u0641\u0636\u0644 \u0644\u0645\u0634\u0627\u0631\u064A\u0639 \u0627\u0644\u0634\u0627\u062A)
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# \u062F\u0631\u062C\u0629 \u0627\u0644\u0625\u0628\u062F\u0627\u0639 (0.7 \u0628\u062A\u062E\u0644\u064A \u0627\u0644\u0631\u062F\u0648\u062F \u0645\u062A\u0646\u0648\u0639\u0629 \u0648\u0633\u064A\u0627\u062D\u064A\u0629)
spring.ai.google.genai.chat.options.temperature=0.7




